name: Update Nuvio repository

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch latest stable Nuvio release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/iqui27/nuvio-native-legacy/releases/latest"
          curl -fsSL             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "$API" > release.json

          jq -e '.draft == false and .prerelease == false' release.json >/dev/null

          TAG="$(jq -r '.tag_name' release.json)"
          VERSION="${TAG#v}"

          # Prefer the normal ARM LG webOS package.
          IPK_URL="$(
            jq -r '
              .assets[]
              | select(.name | endswith("_arm.ipk"))
              | select(.name | contains("highcache") | not)
              | .browser_download_url
            ' release.json | head -n 1
          )"

          IPK_NAME="$(
            jq -r '
              .assets[]
              | select(.name | endswith("_arm.ipk"))
              | select(.name | contains("highcache") | not)
              | .name
            ' release.json | head -n 1
          )"

          if [ -z "$IPK_URL" ] || [ "$IPK_URL" = "null" ]; then
            echo "No standard LG webOS ARM .ipk was found in the latest release."
            jq -r '.assets[].name' release.json
            exit 1
          fi

          # Derive the webOS application ID from the conventional IPK name:
          # <app-id>_<version>_arm.ipk
          APP_ID="$(printf '%s' "$IPK_NAME" | sed -E 's/_[^_]+_arm\.ipk$//')"

          if [ "$APP_ID" = "$IPK_NAME" ]; then
            echo "Could not derive application ID from: $IPK_NAME"
            exit 1
          fi

          printf '%s\n' "$TAG" > latest-tag.txt
          printf '%s\n' "$VERSION" > latest-version.txt
          printf '%s\n' "$IPK_URL" > latest-ipk-url.txt
          printf '%s\n' "$IPK_NAME" > latest-ipk-name.txt
          printf '%s\n' "$APP_ID" > app-id.txt

      - name: Download package and calculate metadata
        shell: bash
        run: |
          set -euo pipefail

          URL="$(cat latest-ipk-url.txt)"
          curl -fL --retry 3 --retry-delay 2 "$URL" -o app.ipk

          SHA256="$(sha256sum app.ipk | awk '{print $1}')"
          SIZE="$(stat -c '%s' app.ipk)"

          printf '%s\n' "$SHA256" > ipk-sha256.txt
          printf '%s\n' "$SIZE" > ipk-size.txt

      - name: Generate Homebrew Channel repository
        shell: bash
        run: |
          set -euo pipefail

          TAG="$(cat latest-tag.txt)"
          VERSION="$(cat latest-version.txt)"
          URL="$(cat latest-ipk-url.txt)"
          APP_ID="$(cat app-id.txt)"
          SHA256="$(cat ipk-sha256.txt)"
          SIZE="$(cat ipk-size.txt)"

          jq -n             --arg id "$APP_ID"             --arg version "$VERSION"             --arg ipk "$URL"             --arg sha "$SHA256"             --argjson size "$SIZE"             '{
              paging: {
                page: 1,
                count: 1,
                maxPage: 1,
                itemsTotal: 1
              },
              packages: [
                {
                  id: $id,
                  title: "Nuvio",
                  iconUri: "https://opengraph.githubassets.com/1/iqui27/nuvio-native-legacy",
                  manifest: {
                    id: $id,
                    version: $version,
                    type: "native",
                    title: "Nuvio",
                    appDescription: "Native Nuvio client for LG webOS.",
                    iconUri: "https://opengraph.githubassets.com/1/iqui27/nuvio-native-legacy",
                    sourceUrl: "https://github.com/iqui27/nuvio-native-legacy",
                    rootRequired: false,
                    ipkUrl: $ipk,
                    ipkHash: {
                      sha256: $sha
                    },
                    ipkSize: $size
                  },
                  pool: "main",
                  shortDescription: "Native Nuvio client for LG webOS.",
                  fullDescriptionUrl: "https://github.com/iqui27/nuvio-native-legacy"
                }
              ]
            }' > repo.json

          jq empty repo.json

          {
            echo "# Nuvio repository status"
            echo
            echo "- Release: $TAG"
            echo "- Version: $VERSION"
            echo "- Package: $(cat latest-ipk-name.txt)"
            echo "- SHA-256: $SHA256"
            echo "- Size: $SIZE bytes"
            echo
            echo "Generated automatically by GitHub Actions."
          } > STATUS.md

      - name: Detect changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- repo.json STATUS.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated repository
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add repo.json STATUS.md
          git commit -m "Update Nuvio to $(cat latest-version.txt)"
          git push
